# =============================================================================
#  genome.bio  —  additional domain for the production instance
#
#  Serves as a REDIRECT to oligodesigner.com, not as a second origin, and that
#  is deliberate: /eln/assets/env.js hard-codes
#      window["env"]["apiUrl"] = "https://oligodesigner.com"
#  so an app served from genome.bio would make every API call cross-origin --
#  CORS, cookies and the OIDC redirect_uri (registered per origin) would all
#  need changing, and deploy.sh rewrites env.js on every deploy, so a per-host
#  copy would be clobbered. Making genome.bio a real second origin is a larger
#  change than a vhost; see the notes at the bottom of this file.
#
#  Install:
#    sudo cp genome-bio.conf /etc/nginx/conf.d/genome-bio.conf
#    sudo nginx -t && sudo systemctl reload nginx
#  TLS: certbot certonly --webroot -w /var/www/certbot -d genome.bio -d www.genome.bio
# =============================================================================

# ---- HTTP :80 → HTTPS (ACME challenge stays on http so renewals keep working) ----
server {
    listen 80;
    listen [::]:80;
    server_name genome.bio www.genome.bio;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://oligodesigner.com$request_uri; }
}

# ---- HTTPS → oligodesigner.com (path and query preserved) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name genome.bio www.genome.bio;

    ssl_certificate     /etc/letsencrypt/live/genome.bio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genome.bio/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # $request_uri keeps the path AND the query string, so a deep link such as
    # https://genome.bio/app/free/editor?file=x lands on the same page.
    return 301 https://oligodesigner.com$request_uri;
}

# -----------------------------------------------------------------------------
#  To make genome.bio serve the app as its own origin instead of redirecting:
#    1. env.js must resolve apiUrl per host (window.location.origin) rather than
#       hard-coding oligodesigner.com -- and deploy.sh must stop overwriting it
#       with the absolute value.
#    2. Register https://genome.bio as a redirect URI with the OIDC provider,
#       or sign-in fails with a redirect_uri mismatch.
#    3. Check Stripe success/cancel URLs, which are built from the API host.
#  Until those are done a redirect is the honest behaviour: the domain works,
#  and auth keeps working with it.
# -----------------------------------------------------------------------------
