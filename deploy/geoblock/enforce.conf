# Included from each TLS server block. This file is the SWITCH: empty it (or
# comment the line out) and blocking stops immediately, with no edit to any site
# config and no chance of breaking one.
#
# `if` inside a server block is only safe for a few directives; `return` is one
# of the two the nginx documentation names explicitly, so this is the supported
# form rather than the notorious one.
#
# 403 rather than 444 (drop the connection) on purpose: a refusal that says it is
# a refusal is one someone can report, and a silent drop looks like the site is
# broken. Change to `return 444;` if the traffic is hostile enough to warrant it.
if ($baja_blocked) {
    return 403 "Not available in your region.\n";
}
