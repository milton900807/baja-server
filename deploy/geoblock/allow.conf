# Exemptions from the geographic block. One "<address-or-cidr> 0;" per line.
#
# geo matches on longest prefix, so an entry here beats the generated network in
# networks.conf that contains it -- which is how a real user inside a blocked
# city keeps access.
#
# Example:
#   203.0.113.45/32 0;   # a named user in Jakarta, added 2026-09-09
