# Geographic blocking for oligodesigner.com -- http context.
#
# Loaded before the site configs (conf.d/*.conf is read alphabetically and this
# is "00-"), because $baja_blocked has to exist before a server block tests it.
#
# $baja_blocked is 1 when the client address falls in a network belonging to a
# place listed in /etc/nginx/baja-geoblock/rules.json, and 0 otherwise. It only
# SETS the variable. Nothing is refused here -- enforce.conf, included from each
# server block, is what turns the variable into a 403, so blocking can be lifted
# by emptying one file without editing any site config.
#
# geo matches on LONGEST PREFIX, not on the order lines appear, so a /32 in
# allow.conf beats the /24 in networks.conf that contains it. That is what makes
# an exemption for one address inside a blocked city work.

geo $baja_blocked {
    default 0;

    # Generated from the DB-IP databases by /opt/baja-geo/build-geoblock.py.
    include /etc/nginx/baja-geoblock/networks.conf;

    # Hand-written exemptions, checked into the same directory. Longest prefix
    # wins, so an address here is served even though its city is blocked.
    include /etc/nginx/baja-geoblock/allow.conf;
}

# For the access log, so a blocked request is identifiable as blocked rather than
# looking like an ordinary 403 from the application.
log_format baja_blocked_fmt '$remote_addr - [$time_local] BLOCKED "$request" '
                            '$status "$http_referer" "$http_user_agent"';
