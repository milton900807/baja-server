# nginx site config for the CONTAINER stack (docker compose).
# Difference vs. the bare-metal conf: upstream points at the compose service "api",
# and the SPA root is nginx:alpine's default html dir. Mounted at
# /etc/nginx/conf.d/default.conf by docker-compose.yml.

upstream baja_api {
    server api:8080;            # compose service name on the "edge" network
    keepalive 32;
}

# ---- HTTP :80 → ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    server_name oligodesigner.com www.oligodesigner.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- www → apex ----
server {
    listen 443 ssl;
    server_name www.oligodesigner.com;
    ssl_certificate     /etc/letsencrypt/live/oligodesigner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oligodesigner.com/privkey.pem;
    return 301 https://oligodesigner.com$request_uri;
}

# ---- main app ----
server {
    listen 443 ssl;
    http2 on;
    server_name oligodesigner.com;

    ssl_certificate     /etc/letsencrypt/live/oligodesigner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oligodesigner.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;

    # SPA client routes → index.html
    location ~ ^/(login|auth|subscribe|signup|app|lft|books|edit|doc|_app)(/|$) {
        try_files $uri /index.html;
    }

    # socket.io WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://baja_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # static first; anything that is not a file and not a SPA route → API
    location / {
        try_files $uri $uri/ @api;
    }
    location @api {
        proxy_pass http://baja_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri @api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /assets/env.js { try_files $uri =404; add_header Cache-Control "no-store"; }
    location = /index.html   { add_header Cache-Control "no-store"; }
}
