# =============================================================================
#  oligodesigner.com — containerized stack (compose)
#
#  Expected sibling layout (compose file lives in baja-server/deploy/):
#     parent/
#       baja/          frontend (Angular)
#       baja-server/   API      ← this file is in baja-server/deploy/
#       baja-apps/     lionscript library (mounted read-only into the API)
#
#  Provide first: ../.env  (server secrets)  and  ./env-prod.js  (public frontend config).
#
#  FIRST RUN — one-time TLS bootstrap (nginx's :443 block needs a cert to exist):
#     DOCKER_BUILDKIT=1 docker compose build
#     docker compose up -d api
#     docker compose run --rm -p 80:80 certbot certonly --standalone \
#         -d oligodesigner.com -d www.oligodesigner.com --agree-tos -m milton@baja.bio
#     docker compose up -d            # web starts now that the cert exists
#
#  Thereafter just:  DOCKER_BUILDKIT=1 docker compose up -d --build
#  The certbot service auto-renews (webroot); logs:  docker compose logs -f api
# =============================================================================
name: oligodesigner

services:
  # ---- Node / TS API (Express + socket.io + python) --------------------------
  api:
    build:
      context: ..                       # baja-server repo root
      dockerfile: deploy/Dockerfile.api
    image: baja-server:prod
    restart: unless-stopped
    env_file:
      - ../.env                         # Stripe live key/price, OAuth secrets, PYTHONPATH…
    environment:
      - NODE_ENV=production
      # Node heap. Keep ~2GB headroom for OS+nginx+python. 8GB box → 6144;
      # 16GB box → 12288; 32GB+ → 24576. Raise after resizing, no rebuild needed.
      - NODE_OPTIONS=--max-old-space-size=6144
    volumes:
      - ../../baja-apps:/opt/baja-apps:ro   # lionscript library, resolved by exec()
      - api-userdata:/opt/baja-server/userdata   # persisted user files / static uploads
    expose:
      - "8080"                          # internal only — never published to the host
    networks: [edge]

  # ---- nginx: serves the Angular SPA + reverse-proxies the API ---------------
  web:
    build:
      context: ../../baja                       # Angular repo (build stage)
      dockerfile: ../baja-server/deploy/Dockerfile.web
    image: baja-web:prod
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./env-prod.js:/usr/share/nginx/html/assets/env.js:ro   # public runtime config
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    networks: [edge]

  # ---- certbot: issue + auto-renew TLS (webroot challenge) -------------------
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renew twice daily; web nginx picks up new certs on its own reload timer.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  edge:
    driver: bridge

volumes:
  letsencrypt:
  certbot-webroot:
  api-userdata:
