# =============================================================================
#  oligodesigner.com  —  nginx site config
#  Same-origin: nginx serves the Angular SPA (static) and reverse-proxies the
#  API (~150 routes) + socket.io to the Node server on 127.0.0.1:8080.
#
#  Install:
#    sudo cp nginx-oligodesigner.conf /etc/nginx/conf.d/oligodesigner.conf
#    sudo nginx -t && sudo systemctl reload nginx
#  TLS certs are issued by certbot (see aws-deploy.md).
# =============================================================================

# ---- upstream API (Node / baja-server) ----
upstream baja_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---- HTTP :80 → redirect to HTTPS (certbot's ACME challenge stays on http) ----
server {
    listen 80;
    listen [::]:80;
    server_name oligodesigner.com www.oligodesigner.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- canonical: www → apex (over HTTPS) ----
server {
    include /etc/nginx/baja-geoblock/enforce*.conf;   # geographic block
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.oligodesigner.com;

    ssl_certificate     /etc/letsencrypt/live/oligodesigner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oligodesigner.com/privkey.pem;

    return 301 https://oligodesigner.com$request_uri;
}

# ---- main app ----
server {
    include /etc/nginx/baja-geoblock/enforce*.conf;   # geographic block
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oligodesigner.com;

    # --- TLS (certbot-managed) ---
    ssl_certificate     /etc/letsencrypt/live/oligodesigner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oligodesigner.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Angular production bundle (from `ng build` → dist → copied here) ---
    root /eln;
    index index.html;

    # large payloads: genome/track uploads, PDFs, exec bodies
    client_max_body_size 512m;

    # long-running exec / off-target / python jobs shouldn't time out at the edge
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;

    # ---------------------------------------------------------------------
    #  SPA client routes → index.html (Angular Router owns these prefixes)
    # ---------------------------------------------------------------------
    location ~ ^/(login|auth|subscribe|signup|app|lft|books|edit|doc|_app)(/|$) {
        try_files $uri /index.html;
    }

    # ---------------------------------------------------------------------
    #  socket.io (WebSocket upgrade) → Node
    # ---------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://baja_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---------------------------------------------------------------------
    #  Static-first: serve real files (JS/CSS/assets/env.js); anything that
    #  is NOT a file and NOT a SPA route falls through to the Node API.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://baja_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # long-cache hashed Angular assets
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri @api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # never cache the runtime config or the shell
    location = /assets/env.js { try_files $uri =404; add_header Cache-Control "no-store"; }
    location = /index.html   { add_header Cache-Control "no-store"; }
}
