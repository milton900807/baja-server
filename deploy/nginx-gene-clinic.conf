# =============================================================================
#  gene.clinic  —  nginx site config
#
#  The SAME application as oligodesigner.com, served from the same /eln bundle
#  and the same Node API. Nothing is forked: the Angular app reads
#  window.location.hostname and shows the family/patient/physician sign-in when
#  it is gene.clinic (see baja/src/app/auth/login.component.ts, clinicMode).
#
#  Which is why `proxy_set_header Host $host` matters here as much as anywhere:
#  the app has to be able to see which domain it was asked for.
#
#  ---------------------------------------------------------------------------
#  INSTALL — in this order, because the 443 blocks reference a certificate that
#  does not exist until certbot has issued it, and nginx -t fails on a missing
#  cert file.
#
#    1. DNS first. gene.clinic and www.gene.clinic must both A-record to this
#       instance's Elastic IP. As of writing they point at 76.223.105.230 /
#       13.248.243.5 (registrar parking), so nothing below can be validated or
#       reached until that changes.
#
#    2. Install with the two 443 blocks commented out, so only :80 is live:
#         sudo cp nginx-gene-clinic.conf /etc/nginx/conf.d/gene-clinic.conf
#         sudo nginx -t && sudo systemctl reload nginx
#
#    3. Issue the certificate through the ACME challenge the :80 block serves:
#         sudo certbot certonly --webroot -w /var/www/certbot \
#              -d gene.clinic -d www.gene.clinic
#
#    4. Uncomment the 443 blocks, then:
#         sudo nginx -t && sudo systemctl reload nginx
#
#  ---------------------------------------------------------------------------
#  The `baja_api` upstream is declared in oligodesigner.conf and is shared. If
#  that file is ever removed, this one stops resolving it -- declare it here.
# =============================================================================

# ---- HTTP :80 → redirect to HTTPS (ACME challenge stays on http) ----
server {
    listen 80;
    listen [::]:80;
    server_name gene.clinic www.gene.clinic;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://gene.clinic$request_uri; }
}

# ---- canonical: www → apex ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gene.clinic;

    ssl_certificate     /etc/letsencrypt/live/gene.clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gene.clinic/privkey.pem;

    return 301 https://gene.clinic$request_uri;
}

# ---- the app ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gene.clinic;

    ssl_certificate     /etc/letsencrypt/live/gene.clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gene.clinic/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The same Angular bundle oligodesigner.com serves. One build, two doors.
    root /eln;
    index index.html;

    client_max_body_size 512m;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;

    # SPA client routes → index.html (Angular Router owns these prefixes)
    location ~ ^/(login|auth|subscribe|signup|app|lft|books|edit|doc|_app)(/|$) {
        try_files $uri /index.html;
    }

    location /socket.io/ {
        proxy_pass http://baja_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://baja_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri @api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /assets/env.js { try_files $uri =404; add_header Cache-Control "no-store"; }
    location = /index.html   { add_header Cache-Control "no-store"; }
}
